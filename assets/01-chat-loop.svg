  <g>
    <rect x="80" y="70" width="220" height="48" rx="14" fill="#243041">
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.2;1" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <text x="100" y="100" fill="#e8e4d9" font-family="Segoe UI, Arial" font-size="16">tú: haz esto&</text>
  </g>
  <g>
