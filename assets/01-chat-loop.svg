  </circle>
  <text x="760" y="146" text-anchor="middle" fill="#ff6b4a" font-family="Segoe UI, Arial" font-size="28" font-weight="700"></text>
  <text x="760" y="220" text-anchor="middle" fill="#ff6b4a" font-family="Segoe UI, Arial" font-size="13">LOOP</text>
