    </rect>
    <text x="100" y="220" fill="#e8e4d9" font-family="Segoe UI, Arial" font-size="16">tú: corrige&</text>
  </g>

  <circle cx="760" cy="140" r="54" fill="none" stroke="#ff6b4a" stroke-width="3" stroke-dasharray="20 12">
