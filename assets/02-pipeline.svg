<svg xmlns="http://www.w3.org/2000/svg" width="920" height="220" viewBox="0 0 920 220" role="img" aria-label="Pipeline fábrica">
  <rect width="920" height="220" rx="20" fill="#0c0d0f"/>
  <text x="40" y="42" fill="#8a867c" font-family="Segoe UI, Arial" font-size="14" letter-spacing="2">FÁBRICA  PIPELINE</text>

  <!-- moving line -->
  <line x1="70" y1="110" x2="850" y2="110" stroke="#3a3428" stroke-width="4"/>
  <line x1="70" y1="110" x2="850" y2="110" stroke="#e6a23c" stroke-width="4" stroke-dasharray="40 860">
    <animate attributeName="stroke-dashoffset" from="0" to="-900" dur="2.2s" repeatCount="indefinite"/>
  </line>

  <!-- nodes -->
  <g font-family="Segoe UI, Arial" text-anchor="middle">
    <g>
      <rect x="60" y="78" width="100" height="64" rx="14" fill="#14161a" stroke="#e6a23c" stroke-width="2">
        <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="2.2s" begin="0s" repeatCount="indefinite"/>
      </rect>
      <text x="110" y="115" fill="#e8e4d9" font-size="15" font-weight="600">Entrada</text>
      <text x="110" y="168" fill="#8a867c" font-size="12">idea / bug</text>
    </g>
    <g>
      <rect x="200" y="78" width="100" height="64" rx="14" fill="#14161a" stroke="#e6a23c" stroke-width="2">
        <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="2.2s" begin="0.35s" repeatCount="indefinite"/>
      </rect>
      <text x="250" y="115" fill="#e8e4d9" font-size="15" font-weight="600">Spec</text>
      <text x="250" y="168" fill="#8a867c" font-size="12">qué</text>
    </g>
    <g>
      <rect x="340" y="78" width="100" height="64" rx="14" fill="#14161a" stroke="#e6a23c" stroke-width="2">
        <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="2.2s" begin="0.7s" repeatCount="indefinite"/>
      </rect>
      <text x="390" y="115" fill="#e8e4d9" font-size="15" font-weight="600">Plan</text>
      <text x="390" y="168" fill="#8a867c" font-size="12">cómo</text>
    </g>
    <g>
      <rect x="480" y="78" width="100" height="64" rx="14" fill="#14161a" stroke="#e6a23c" stroke-width="2">
        <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="2.2s" begin="1.05s" repeatCount="indefinite"/>
      </rect>
      <text x="530" y="115" fill="#e8e4d9" font-size="15" font-weight="600">Build</text>
      <text x="530" y="168" fill="#8a867c" font-size="12">hacer</text>
    </g>
    <g>
      <rect x="620" y="78" width="100" height="64" rx="14" fill="#14161a" stroke="#e6a23c" stroke-width="2">
        <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="2.2s" begin="1.4s" repeatCount="indefinite"/>
      </rect>
      <text x="670" y="115" fill="#e8e4d9" font-size="15" font-weight="600">Review</text>
      <text x="670" y="168" fill="#8a867c" font-size="12">mirar</text>
    </g>
    <g>
      <rect x="760" y="78" width="100" height="64" rx="14" fill="#14161a" stroke="#3dd68c" stroke-width="2">
        <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="2.2s" begin="1.75s" repeatCount="indefinite"/>
      </rect>
      <text x="810" y="115" fill="#e8e4d9" font-size="15" font-weight="600">Out</text>
      <text x="810" y="168" fill="#3dd68c" font-size="12">listo</text>
    </g>
  </g>
</svg>
