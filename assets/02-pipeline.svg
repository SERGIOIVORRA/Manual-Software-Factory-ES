<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img">
  <rect width="1200" height="380" rx="24" fill="#111318"/>
  <text x="48" y="52" fill="#f0c56a" font-family="Segoe UI, Arial" font-size="15" letter-spacing="4">02 — LA FÁBRICA</text>
  <text x="48" y="96" fill="#f5f1e8" font-family="Georgia, Times New Roman, serif" font-size="34" font-weight="700">Petición entra. Entregable sale.</text>

  <!-- track -->
  <rect x="60" y="188" width="1080" height="8" rx="4" fill="#2a261f"/>
  <rect x="60" y="188" width="1080" height="8" rx="4" fill="#e6a23c" opacity="0.35"/>

  <!-- steps -->
  <g font-family="Segoe UI, Arial" text-anchor="middle">
    <g transform="translate(110,0)">
      <rect x="-70" y="140" width="140" height="100" rx="20" fill="#1a1d24" stroke="#f0c56a" stroke-width="2.5"/>
      <text y="185" fill="#f0c56a" font-size="22" font-weight="700">1</text>
      <text y="215" fill="#f5f1e8" font-size="18" font-weight="600">Entrada</text>
      <text y="280" fill="#9a958a" font-size="14">idea / bug</text>
    </g>
    <g transform="translate(310,0)">
      <rect x="-70" y="140" width="140" height="100" rx="20" fill="#1a1d24" stroke="#f0c56a" stroke-width="2.5"/>
      <text y="185" fill="#f0c56a" font-size="22" font-weight="700">2</text>
      <text y="215" fill="#f5f1e8" font-size="18" font-weight="600">Spec</text>
      <text y="280" fill="#9a958a" font-size="14">qué</text>
    </g>
    <g transform="translate(510,0)">
      <rect x="-70" y="140" width="140" height="100" rx="20" fill="#1a1d24" stroke="#f0c56a" stroke-width="2.5"/>
      <text y="185" fill="#f0c56a" font-size="22" font-weight="700">3</text>
      <text y="215" fill="#f5f1e8" font-size="18" font-weight="600">Plan</text>
      <text y="280" fill="#9a958a" font-size="14">cómo</text>
    </g>
    <g transform="translate(710,0)">
      <rect x="-70" y="140" width="140" height="100" rx="20" fill="#1a1d24" stroke="#f0c56a" stroke-width="2.5"/>
      <text y="185" fill="#f0c56a" font-size="22" font-weight="700">4</text>
      <text y="215" fill="#f5f1e8" font-size="18" font-weight="600">Build</text>
      <text y="280" fill="#9a958a" font-size="14">hacer</text>
    </g>
    <g transform="translate(910,0)">
      <rect x="-70" y="140" width="140" height="100" rx="20" fill="#1a1d24" stroke="#f0c56a" stroke-width="2.5"/>
      <text y="185" fill="#f0c56a" font-size="22" font-weight="700">5</text>
      <text y="215" fill="#f5f1e8" font-size="18" font-weight="600">Review</text>
      <text y="280" fill="#9a958a" font-size="14">mirar</text>
    </g>
    <g transform="translate(1090,0)">
      <rect x="-70" y="140" width="120" height="100" rx="20" fill="#15241c" stroke="#3dd68c" stroke-width="2.5"/>
      <text y="185" fill="#3dd68c" font-size="22" font-weight="700">6</text>
      <text y="215" fill="#f5f1e8" font-size="18" font-weight="600">Out</text>
      <text y="280" fill="#3dd68c" font-size="14">listo</text>
    </g>
  </g>

  <text x="600" y="350" text-anchor="middle" fill="#9a958a" font-family="Segoe UI, Arial" font-size="16">tú diriges el carril · no escribes cada mensaje</text>
</svg>
