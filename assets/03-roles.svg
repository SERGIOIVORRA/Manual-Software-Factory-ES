<svg xmlns="http://www.w3.org/2000/svg" width="920" height="260" viewBox="0 0 920 260" role="img" aria-label="Roles">
  <rect width="920" height="260" rx="20" fill="#0c0d0f"/>
  <text x="40" y="42" fill="#8a867c" font-family="Segoe UI, Arial" font-size="14" letter-spacing="2">ROLES  CADA UNO UN OFICIO</text>

  <circle cx="460" cy="145" r="46" fill="#1a1712" stroke="#e6a23c" stroke-width="2">
    <animate attributeName="r" values="42;48;42" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <text x="460" y="140" text-anchor="middle" fill="#e6a23c" font-family="Segoe UI, Arial" font-size="13">CONTEXTO</text>
  <text x="460" y="160" text-anchor="middle" fill="#8a867c" font-family="Segoe UI, Arial" font-size="11">memoria</text>

  <!-- orbiting roles -->
  <g font-family="Segoe UI, Arial" text-anchor="middle">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 460 145" to="360 460 145" dur="12s" repeatCount="indefinite"/>
      <rect x="410" y="40" width="100" height="44" rx="12" fill="#14161a" stroke="#2a2c31"/>
      <text x="460" y="67" fill="#e8e4d9" font-size="14">Spec</text>
    </g>
  </g>
  <g font-family="Segoe UI, Arial" text-anchor="middle">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="72 460 145" to="432 460 145" dur="12s" repeatCount="indefinite"/>
      <rect x="410" y="40" width="100" height="44" rx="12" fill="#14161a" stroke="#2a2c31"/>
      <text x="460" y="67" fill="#e8e4d9" font-size="14">Plan</text>
    </g>
  </g>
  <g font-family="Segoe UI, Arial" text-anchor="middle">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="144 460 145" to="504 460 145" dur="12s" repeatCount="indefinite"/>
      <rect x="410" y="40" width="100" height="44" rx="12" fill="#14161a" stroke="#2a2c31"/>
      <text x="460" y="67" fill="#e8e4d9" font-size="14">Build</text>
    </g>
  </g>
  <g font-family="Segoe UI, Arial" text-anchor="middle">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="216 460 145" to="576 460 145" dur="12s" repeatCount="indefinite"/>
      <rect x="410" y="40" width="100" height="44" rx="12" fill="#14161a" stroke="#2a2c31"/>
      <text x="460" y="67" fill="#e8e4d9" font-size="14">Review</text>
    </g>
  </g>
  <g font-family="Segoe UI, Arial" text-anchor="middle">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="288 460 145" to="648 460 145" dur="12s" repeatCount="indefinite"/>
      <rect x="410" y="40" width="100" height="44" rx="12" fill="#14161a" stroke="#2a2c31"/>
      <text x="460" y="67" fill="#e8e4d9" font-size="14">Test</text>
    </g>
  </g>
</svg>
