<svg xmlns="http://www.w3.org/2000/svg" width="920" height="180" viewBox="0 0 920 180" role="img" aria-label="De chatear a orquestar">
  <rect width="920" height="180" rx="20" fill="#0c0d0f"/>
  <text x="40" y="42" fill="#8a867c" font-family="Segoe UI, Arial" font-size="14" letter-spacing="2">EL SALTO</text>

  <rect x="80" y="70" width="260" height="70" rx="16" fill="#3a2a2a" stroke="#ff6b4a"/>
  <text x="210" y="112" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial" font-size="22" font-weight="700">Chatear</text>

  <polygon points="400,105 430,90 430,100 500,100 500,110 430,110 430,120" fill="#e6a23c">
    <animateTransform attributeName="transform" type="translate" values="0 0; 12 0; 0 0" dur="1.2s" repeatCount="indefinite"/>
  </polygon>

  <rect x="560" y="70" width="280" height="70" rx="16" fill="#2a3a2a" stroke="#3dd68c"/>
  <text x="700" y="112" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial" font-size="22" font-weight="700">Orquestar</text>
</svg>
